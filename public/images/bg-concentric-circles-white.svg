<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="concentric-rings-white" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Circle Group Center 1 (Top Left / 0,0) -->
      <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15">
        <circle cx="0" cy="0" r="25" />
        <circle cx="0" cy="0" r="50" />
        <circle cx="0" cy="0" r="75" />
        <circle cx="0" cy="0" r="100" />
      </g>
      <!-- Circle Group Center 2 (Center / 100,100) -->
      <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15">
        <circle cx="100" cy="100" r="25" />
        <circle cx="100" cy="100" r="50" />
        <circle cx="100" cy="100" r="75" />
        <circle cx="100" cy="100" r="100" />
      </g>
      <!-- Circle Group Center 3 (Top Right / 200,0) -->
      <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15">
        <circle cx="200" cy="0" r="25" />
        <circle cx="200" cy="0" r="50" />
        <circle cx="200" cy="0" r="75" />
        <circle cx="200" cy="0" r="100" />
      </g>
      <!-- Circle Group Center 4 (Bottom Left / 0,200) -->
      <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15">
        <circle cx="0" cy="200" r="25" />
        <circle cx="0" cy="200" r="50" />
        <circle cx="0" cy="200" r="75" />
        <circle cx="0" cy="200" r="100" />
      </g>
      <!-- Circle Group Center 5 (Bottom Right / 200,200) -->
      <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15">
        <circle cx="200" cy="200" r="25" />
        <circle cx="200" cy="200" r="50" />
        <circle cx="200" cy="200" r="75" />
        <circle cx="200" cy="200" r="100" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#concentric-rings-white)" />
</svg>
