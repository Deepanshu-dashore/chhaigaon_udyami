      <circle cx="150" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.08" />
      <circle cx="0" cy="150" r="30" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.08" />
      <circle cx="0" cy="150" r="60" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.08" />
