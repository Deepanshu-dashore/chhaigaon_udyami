      <circle cx="75" cy="75" r="20" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.1" />
      <circle cx="75" cy="75" r="40" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.1" />
      <circle cx="75" cy="75" r="60" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.1" />
